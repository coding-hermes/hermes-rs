[workspace]
resolver = "2"
members = ["."]

[package]
name = "hermes-rs"
version = "0.1.0"
edition = "2021"
description = "Foundation scaffold for the Hermes RS project"
license = "MIT"

[lib]
name = "hermes_rs"
path = "src/lib.rs"

[[bin]]
name = "hermes-rs"
path = "src/main.rs"

# HRS-003 Python interop: process-boundary adapter server (specs/python-interop.md).
[[bin]]
name = "hermes-rs-session-adapter"
path = "src/bin/session_adapter.rs"

# HRS-010 session-store vertical slice: stock SQLite backend.
# `bundled` pins libsqlite3 (FTS5 + trigram tokenizer enabled in the
# amalgamation) so file-format behavior does not drift with the host
# libsqlite3. No alternative engine is linked (HRS-009 deferred).
# HRS-009 optional candidate-backend evaluation (specs/backend-evaluation.md):
# `turso` is an OPTIONAL feature, never a default; stock SQLite remains the
# only default backend (specs/persistence-shim.md §3.1). The build without
# this feature must stay green.
[features]
turso = ["dep:turso", "dep:tokio"]

[dependencies]
rusqlite = { version = "0.40", features = ["bundled", "backup", "functions"] }
regex = "1"
# HRS-003 Python interop adapter: JSON request/response frames over stdio.
serde_json = "1"
# HRS-009 optional candidate backend (feature `turso` only). Async API —
# driven from the sync shim through a current-thread tokio runtime.
turso = { version = "0.8.3", optional = true }
tokio = { version = "1", features = ["rt", "time"], optional = true }
