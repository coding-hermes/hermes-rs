name: Rust CI

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain*
      - '**/Cargo.toml'
      - '**/*.rs'
      - 'scripts/hrs003_e2e_proof.py'
      - 'scripts/hrs003_client.py'
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain*
      - '**/Cargo.toml'
      - '**/*.rs'
      - 'scripts/hrs003_e2e_proof.py'
      - 'scripts/hrs003_client.py'

permissions:
  contents: read

jobs:
  rust:
    name: Rust format, lint, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-features
      - name: Batch + model-usage wire proof (DF-HRS-112)
        run: python3 scripts/hrs003_e2e_proof.py --mode batch-wire
