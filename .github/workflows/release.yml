name: Release

# The two entry points are deliberately different: a v* tag push publishes;
# workflow_dispatch either republishes an existing tag or runs a build-only
# rehearsal that publishes nothing.
#
# hermes-rs is an independent Rust project. This workflow publishes binaries and
# checksums; it makes no compatibility or performance claim. Toolchain: the
# stable Rust channel selected by rust-toolchain.toml, with the two targets
# below installed. SQLite is statically linked into the binaries through
# rusqlite's `bundled` feature; libc is the target's glibc (the -gnu targets are
# already available in the target listing, so no musl rebuild is attempted and
# no fully-static artifact is claimed).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish; leave empty for a build-only run'
        required: false
        type: string
      version:
        description: 'Version for a build-only run, for example 0.1.0 or v0.1.0'
        required: false
        type: string
      dry_run:
        description: 'Build and verify only; never publish'
        required: false
        default: false
        type: boolean
      rehearse_undated_changelog:
        description: 'In dry_run only, waive the dated CHANGELOG section check'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && (inputs.tag || inputs.version || github.sha) || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve and validate the release ref
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
    steps:
      - name: Resolve the target ref and version
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          EVENT_SHA: ${{ github.sha }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          dry_run=false
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            dry_run="${INPUT_DRY_RUN:-false}"
          fi

          if [ "$EVENT_NAME" = push ]; then
            tag="$EVENT_REF_NAME"
            version="${tag#v}"
            ref="$tag"
          elif [ "$dry_run" = true ]; then
            if [ -n "${INPUT_TAG:-}" ]; then
              tag="$INPUT_TAG"
              version="${tag#v}"
              if [ -n "${INPUT_VERSION:-}" ]; then
                requested="${INPUT_VERSION#v}"
                [ "$requested" = "$version" ] || {
                  echo "::error::requested version '$requested' does not match requested tag version '$version'"
                  exit 1
                }
              fi
            else
              version="${INPUT_VERSION:-}"
              version="${version#v}"
              [ -n "$version" ] || {
                echo "::error::version is required when tag is empty"
                exit 1
              }
              tag="v$version"
            fi
            ref="$EVENT_SHA"
          else
            [ -n "${INPUT_TAG:-}" ] || {
              echo "::error::publish dispatch requires an existing tag; use dry_run for a build-only run"
              exit 1
            }
            tag="$INPUT_TAG"
            version="${tag#v}"
            if [ -n "${INPUT_VERSION:-}" ]; then
              requested="${INPUT_VERSION#v}"
              [ "$requested" = "$version" ] || {
                echo "::error::requested version '$requested' does not match requested tag version '$version'"
                exit 1
              }
            fi
            ref="$tag"
          fi

          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::release tag '$tag' must look like vX.Y.Z"
            exit 1
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::requested version '$version' must look like X.Y.Z"
            exit 1
          fi
          {
            printf 'ref=%s\n' "$ref"
            printf 'tag=%s\n' "$tag"
            printf 'version=%s\n' "$version"
            printf 'dry_run=%s\n' "$dry_run"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the resolved ref
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.ref }}
          fetch-depth: 0

      - name: The checked-out commit must be a main-line commit
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$(git rev-parse HEAD) is not an ancestor of origin/main; releases are cut from main only"
            exit 1
          fi

      - name: The requested version must match the manifest version
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          manifest="$(awk '
            /^\[package\]$/ { in_package = 1; next }
            /^\[/ { in_package = 0 }
            in_package && $1 == "version" { v = $3; gsub(/"/, "", v); print v; exit }
          ' Cargo.toml)"
          if [ "$manifest" != "$VERSION" ]; then
            echo "::error::requested version '$VERSION' does not match Cargo.toml [package] version '$manifest'"
            exit 1
          fi
          echo "manifest version $manifest matches requested version $VERSION"

      - name: Require the dated CHANGELOG section unless this is a rehearsal
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          DRY_RUN: ${{ steps.resolve.outputs.dry_run }}
          REHEARSE_UNDATED_CHANGELOG: ${{ inputs.rehearse_undated_changelog }}
        run: |
          set -euo pipefail
          escaped="${VERSION//./\\.}"
          if grep -Eq "^## \[${escaped}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md carries a dated section for $VERSION"
          elif [ "$DRY_RUN" = true ] && [ "$REHEARSE_UNDATED_CHANGELOG" = true ]; then
            echo "::warning::waived exactly the dated CHANGELOG section requirement for $VERSION during this build-only rehearsal"
          else
            echo "::error::CHANGELOG.md has no dated section for $VERSION; cut the release with scripts/release.sh (see docs/releases.md)"
            exit 1
          fi

      - name: The dispatched publish tag must exist on origin
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --refs origin "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "::error::publish tag '$RELEASE_TAG' does not exist on origin"
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - name: Check out the resolved ref
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install the aarch64 cross C toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu

      - name: Build both binaries
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: |
          set -euo pipefail
          cargo build --release --locked --target ${{ matrix.target }} \
            --bin hermes-rs --bin hermes-rs-session-adapter

      - name: Name the artifacts
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for bin in hermes-rs hermes-rs-session-adapter; do
            src="target/${{ matrix.target }}/release/$bin"
            test -x "$src" || { echo "::error::missing build output $src"; exit 1; }
            cp -- "$src" "dist/${bin}-${RELEASE_TAG}-${{ matrix.target }}"
          done
          file dist/*

      - name: Smoke-run the binaries (host target only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cli="dist/hermes-rs-${RELEASE_TAG}-${{ matrix.target }}"
          adapter="dist/hermes-rs-session-adapter-${RELEASE_TAG}-${{ matrix.target }}"
          cli_out="$("$cli" --version)"
          echo "$cli_out"
          if [ "$cli_out" != "hermes-rs $VERSION" ]; then
            echo "::error::'$cli --version' printed '$cli_out', expected 'hermes-rs $VERSION'"
            exit 1
          fi
          adapter_out="$("$adapter" --protocol)"
          echo "$adapter_out"
          if [ "$adapter_out" != "hermes-rs/session-adapter/1" ]; then
            echo "::error::adapter protocol banner mismatch: '$adapter_out'"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  verify:
    name: Verify release artifacts
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Check every expected artifact and verify checksums
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p assembled
          missing=0
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            for bin in hermes-rs hermes-rs-session-adapter; do
              f="${bin}-${RELEASE_TAG}-${target}"
              source="dist/release-${target}/$f"
              if [ -f "$source" ]; then
                cp -- "$source" assembled/"$f"
                echo "present: $f"
              else
                echo "::error::missing artifact: $f"
                missing=1
              fi
            done
          done
          [ "$missing" -eq 0 ] || exit 1
          cd assembled
          sha256sum hermes-rs-* > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-SHA256SUMS
          path: assembled/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish the GitHub Release
    needs: [prepare, build, verify]
    if: needs.prepare.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build the release body from the CHANGELOG section
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          {
            printf '> hermes-rs is an independent Rust project. It is not an official\n'
            printf '> Nous Research release and it is not a drop-in replacement for\n'
            printf '> Hermes Agent. No compatibility or performance claim is made beyond\n'
            printf '> the committed evidence in docs/evidence/.\n'
            printf '>\n'
            printf '> Verify the downloads: sha256sum -c SHA256SUMS.\n\n'
            awk -v heading="## [${VERSION}] - " '
              index($0, heading) == 1 { inside = 1; next }
              inside && /^## \[/ { exit }
              inside { print }
            ' CHANGELOG.md
          } > RELEASE-NOTES.md
          if [ "$(grep -c . RELEASE-NOTES.md)" -lt 5 ]; then
            echo "::error::the release body is empty; refusing to publish"
            exit 1
          fi

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: hermes-rs ${{ needs.prepare.outputs.tag }}
          body_path: RELEASE-NOTES.md
          generate_release_notes: false
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/hermes-rs-*
            dist/SHA256SUMS
