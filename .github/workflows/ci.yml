name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project-artifacts:
    name: Project contracts and board integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate kickoff contracts and board JSONL
        run: python3 scripts/check-project-artifacts.py
      - name: Check the usage skill's board claims
        run: python3 scripts/check_skill_claims.py
      - name: Check committed whitespace
        run: git show --check --oneline --no-renames HEAD
